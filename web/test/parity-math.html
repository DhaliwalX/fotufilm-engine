<!doctype html><meta charset="utf-8" /><title>Float operation parity</title>
<body>
  <h1>CPU / WebGPU float operations</h1>
  <pre id="out">Loading…</pre>
  <pre id="report"></pre>
  <script type="module">
    import { relatedAssetUrl } from "/src/runtime-assets.js";
    const out = document.querySelector("#out"),
      report = document.querySelector("#report");
    const names = [
      "add",
      "subtract",
      "multiply",
      "divide",
      "multiply-add",
      "add-product",
      "exp",
      "log",
      "pow",
      "sqrt",
      "difference/divisor",
      "softplus",
      "exp-negative",
      "log-one-plus",
    ];
    const query = new URLSearchParams(location.search);
    try {
      const n = Number(query.get("count") || 4096);
      if (!Number.isSafeInteger(n) || n < 1 || n > 1048576) {
        throw Error("count must be an integer from 1 to 1048576");
      }
      const values = new Float32Array(n * 3);
      let random = Number(query.get("seed") || 0x12345678);
      if (!Number.isInteger(random) || random < 1 || random > 0xffffffff) {
        throw Error("seed must be an integer from 1 to 4294967295");
      }
      function uniform() {
        random ^= random << 13;
        random ^= random >>> 17;
        random ^= random << 5;
        return (random >>> 0) / 4294967296;
      }
      for (let i = 0; i < n; i++) {
        values[i] = 2 ** (-12 + uniform() * 16);
        values[n + i] = 0.125 + uniform() * 2;
        values[n * 2 + i] = (uniform() - 0.5) * 8;
      }
      if (query.get("suite") === "finite") {
        const words = new Uint32Array(values.buffer);
        for (let i = 0; i < n; i++) {
          words[i] = Math.floor(uniform() * 0x7f800000);
          words[n + i] =
            Math.floor(uniform() * 0x7f800000) |
            (uniform() < 0.5 ? 0x80000000 : 0);
          words[2 * n + i] =
            Math.floor(uniform() * 0x7f800000) |
            (uniform() < 0.5 ? 0x80000000 : 0);
        }
        const edge = [
          0, 1, 2, 0x007fffff, 0x00800000, 0x00800001, 0x3f000000, 0x3f800000,
          0x3f800001, 0x40000000, 0x7f7fffff,
        ];
        for (let i = 0; i < Math.min(n, edge.length ** 2); i++) {
          words[i] = edge[i % edge.length];
          words[n + i] = edge[Math.floor(i / edge.length)];
          words[2 * n + i] = words[i] ^ 0x80000000;
        }
      }
      const outputs = [];
      for (const kind of ["cpu", "gpu"]) {
        out.textContent = "Running " + kind;
        if (kind === "gpu" && query.has("software")) {
          const adapter = await navigator.gpu.requestAdapter();
          if (!adapter)
            throw Error(
              "No WebGPU adapter; this test does not fall back to CPU.",
            );
          const device = await adapter.requestDevice();
          device.pushErrorScope("validation");
          const helpers = await (
            await fetch("/parity/softfloat.wgsl?v=" + query.get("revision"))
          ).text();
          const code =
            helpers +
            `
@group(0) @binding(0) var<storage,read> input: array<f32>;
@group(0) @binding(1) var<storage,read_write> output: array<f32>;
@compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id: vec3<u32>) {
 let n=arrayLength(&input)/3u; let i=id.x; let op=id.y; if(i>=n){return;}
 let a=input[i]; let b=input[n+i]; let c=input[2u*n+i]; var r=0.0;
 switch op {
 case 0u: { r=sf_add(a,b); } case 1u: { r=sf_sub(a,b); }
 case 2u: { r=sf_mul(a,b); } case 3u: { r=sf_div(a,b); }
 case 4u: { r=sf_add(sf_mul(a,b),c); } case 5u: { r=sf_add(a,sf_mul(b,c)); }
 case 6u: { r=sf_exp(a); } case 7u: { r=sf_log(a); }
 case 8u: { r=sf_pow(a,b); } case 9u: { r=sf_sqrt(a); }
 case 10u: { r=sf_div(sf_sub(a,b),c); }
 case 11u: { if a>20.0 { r=a; } else if a < -20.0 { r=sf_exp(a); } else { r=sf_log(sf_add(1.0,sf_exp(a))); } }
 case 12u: { r=sf_exp(-a); } case 13u: { r=sf_log(sf_add(1.0,a)); }
 default: {}
 }
 output[op*n+i]=r;
}`;
          const module = device.createShaderModule({ code });
          const info = await module.getCompilationInfo();
          const errors = info.messages.filter((m) => m.type === "error");
          if (errors.length)
            throw Error(
              errors.map((e) => e.message + " at " + e.lineNum).join("\n"),
            );
          const pipeline = await device.createComputePipelineAsync({
            layout: "auto",
            compute: { module, entryPoint: "main" },
          });
          const input = device.createBuffer({
            size: values.byteLength,
            usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
          });
          const size = n * names.length * 4;
          const output = device.createBuffer({
            size,
            usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
          });
          const read = device.createBuffer({
            size,
            usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
          });
          device.queue.writeBuffer(input, 0, values);
          const group = device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: [
              { binding: 0, resource: { buffer: input } },
              { binding: 1, resource: { buffer: output } },
            ],
          });
          const encoder = device.createCommandEncoder(),
            pass = encoder.beginComputePass();
          pass.setPipeline(pipeline);
          pass.setBindGroup(0, group);
          pass.dispatchWorkgroups(Math.ceil(n / 64), names.length);
          pass.end();
          encoder.copyBufferToBuffer(output, 0, read, 0, size);
          device.queue.submit([encoder.finish()]);
          await read.mapAsync(GPUMapMode.READ);
          outputs.push(new Float32Array(read.getMappedRange().slice(0)));
          read.unmap();
          const validation = await device.popErrorScope();
          if (validation) throw Error(validation.message);
          input.destroy();
          output.destroy();
          read.destroy();
          device.destroy();
          continue;
        }
        const url = new URL(
          "/parity/math-" +
            kind +
            ".mjs?v=" +
            new URLSearchParams(location.search).get("revision"),
          location.href,
        ).href;
        const create = (await import(url)).default;
        const m = await create({
          locateFile: (name) => relatedAssetUrl(name, url),
        });
        const input = m._malloc(values.byteLength),
          output = m._malloc(n * names.length * 4);
        m.HEAPF32.set(values, input / 4);
        const status =
          kind === "gpu"
            ? await m.ccall(
                "run_math",
                "number",
                ["number", "number", "number"],
                [input, output, n],
                { async: true },
              )
            : m._run_math(input, output, n);
        if (status) throw Error(kind + " returned " + status);
        outputs.push(
          m.HEAPF32.slice(output / 4, output / 4 + n * names.length),
        );
        m._free(input);
        m._free(output);
      }
      const [a, b] = outputs,
        ab = new Uint32Array(a.buffer),
        bb = new Uint32Array(b.buffer);
      const order = (x) => (x & 0x80000000 ? 0xffffffff - x : x + 0x80000000);
      const results = names.flatMap((name, op) => {
        if (
          query.get("suite") === "finite" &&
          ![0, 1, 2, 3, 4, 5, 9, 10].includes(op)
        )
          return [];
        let different = 0,
          maxAbs = 0,
          maxULP = 0,
          first = null;
        for (let i = 0; i < n; i++) {
          const p = op * n + i;
          if (ab[p] === bb[p]) continue;
          different++;
          maxAbs = Math.max(maxAbs, Math.abs(a[p] - b[p]));
          maxULP = Math.max(maxULP, Math.abs(order(ab[p]) - order(bb[p])));
          first ??= {
            a: values[i],
            b: values[n + i],
            c: values[2 * n + i],
            cpu: a[p],
            gpu: b[p],
            cpuBits: ab[p].toString(16),
            gpuBits: bb[p].toString(16),
          };
        }
        return [{ name, different, count: n, maxAbs, maxULP, first }];
      });
      out.textContent = results
        .map(
          (r) =>
            `${r.name}: ${r.different}/${n} differ; max abs ${r.maxAbs}; max ULP ${r.maxULP}`,
        )
        .join("\n");
      report.textContent = JSON.stringify(results, null, 2);
      document.title = "Float operation parity — complete";
    } catch (error) {
      out.textContent = error.stack;
      document.title = "Float operation parity — ERROR";
    }
  </script>
</body>
