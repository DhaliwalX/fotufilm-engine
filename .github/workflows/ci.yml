name: Engine and desktop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      # Package.swift detects Halide while resolving targets, before any SwiftPM build.
      - run: brew install halide libraw little-cms2 libtiff
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portable RAW limits and radiance
        run: tools/test-raw-codec.sh
      - name: Portable TIFF limits, colour and precision
        run: tools/test-tiff-codec.sh
      - run: python3 tools/generate-config-layout.py --check
      - run: python3 tools/generate-aot-variants.py --check
      - run: swift run fotufilm-controls --check
      - run: python3 tools/test-config-layout.py
      - run: python3 tools/test-aot-variants.py
      - run: python3 tools/test-film-profiles.py
      - run: python3 tools/test-compile-if-needed.py
      - run: python3 tools/test-aot-release.py
      - run: python3 tools/test-audit-bundle-paths.py
      - run: python3 tools/test-compiled-cache.py
      - run: python3 tools/test-test-engine.py
      - run: bash tools/test-stages.sh
      - run: bash tools/test-grain-sampling.sh
      - run: bash tools/test-portable-grain.sh
      # The runner splits the suite across workers, then audits that every test ran.
      - name: Complete release tests
        run: python3 tools/test-engine.py --workers 2
      - name: Shared custom-stock draft round trips
        run: python3 tools/test-custom-stock-draft.py
      - run: swift build
      - run: finalcut/build.sh --test
        if: github.event_name == 'workflow_dispatch'
      - run: cef/build.sh
        if: github.event_name == 'workflow_dispatch'
      - run: tools/verify-aot-parity.sh
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        if: github.event_name == 'workflow_dispatch'
        working-directory: web
