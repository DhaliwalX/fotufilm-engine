name: Engine and desktop
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: python3 tools/check-source-boundary.py
      - run: python3 tools/test-source-boundary.py
      - run: python3 tools/test-film-profiles.py
      - run: brew install halide
      # Compile the largest Metal grain pipeline without other test processes competing
      # for the hosted runner's GPU resources. It remains part of the required suite.
      - name: Resolved silver grain on Metal
        run: swift test -c release --filter testResolvedSilverDiscsMatchCPUAndChangeWithTheSeed
      - name: Remaining release tests
        run: swift test -c release --parallel --num-workers 2 --skip testResolvedSilverDiscsMatchCPUAndChangeWithTheSeed
      - run: swift build
      - run: finalcut/build.sh --test
      - run: macos/build.sh --test
      - run: tools/verify-aot-parity.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
