name: Engine and desktop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      # Package.swift detects Halide while resolving targets, before any SwiftPM build.
      - run: brew install halide
      - run: python3 tools/check-source-boundary.py
      - run: swift run fotufilm-controls --check
      - run: python3 tools/test-source-boundary.py
      - run: python3 tools/test-film-profiles.py
      - run: python3 tools/test-compile-if-needed.py
      - run: python3 tools/test-aot-release.py
      - run: python3 tools/test-audit-bundle-paths.py
      - run: python3 tools/test-compiled-cache.py
      - run: python3 tools/test-test-engine.py
      - run: bash tools/test-grain-coverage.sh
      # The runner isolates the largest Metal grain test, then audits the complete suite.
      - name: Complete release tests
        run: python3 tools/test-engine.py --workers 2
      - name: Shared custom-stock draft round trips
        run: python3 tools/test-custom-stock-draft.py
      - run: swift build
      - run: finalcut/build.sh --test
        if: github.event_name == 'workflow_dispatch'
      - run: macos/build.sh --test
        if: github.event_name == 'workflow_dispatch'
      - run: tools/verify-aot-parity.sh
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        if: github.event_name == 'workflow_dispatch'
        working-directory: web
