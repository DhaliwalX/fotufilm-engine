name: fotufilm_flutter
description: "A native Flutter prototype of the Fotufilm desktop editor."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  desktop_drop: ^0.8.4
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  material_ui: ^1.11.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  config:
    # The Mac app is Apple silicon alone (the engine is): no Intel half is compiled and then dropped.
    enable-macos-arm64-only: true
  uses-material-design: false
  shaders:
    - shaders/display_p3_to_srgb.frag
  # Staged by tool/prepare.sh from web/ and Fontshare; not committed.
  assets:
    - assets/generated/
    - assets/generated/glyphs/
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/generated/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/generated/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/generated/fonts/Satoshi-Bold.otf
          weight: 700
