<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fotufilm develops photographs on film, in the browser.">
  <title>Fotufilm</title>
  <link rel="icon" type="image/png" href="assets/assets/generated/app-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #e8e9eb; }
    @media (prefers-color-scheme: dark) { html, body { background: #202124; } }

<body>
  <!-- The browser engine (web/src/flutter-bridge.js, bundled by tool/build-web.sh): it installs
       globalThis.fotufilmEngine, which the editor waits for. -->

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
